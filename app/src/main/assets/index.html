<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10120f"><title>오늘의 홈트 — 루틴 체크</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');
:root{--bg:#10120f;--panel:#191c18;--panel2:#20241f;--line:#30352e;--text:#f2f3ed;--muted:#92988c;--lime:#c8f169;--lime2:#b1df55;--orange:#ff9366;--blue:#88b9ff;--r:20px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,'Noto Sans KR',sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}.app{width:min(1160px,100%);margin:auto;padding:24px 28px 54px}.top{display:flex;align-items:center;justify-content:space-between;padding:8px 0 32px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.04em;font-size:19px}.brandmark{width:38px;height:38px;border-radius:13px;background:var(--lime);color:#15190e;display:grid;place-items:center;font-size:19px}.date{color:var(--muted);font-size:13px}.main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,.85fr);gap:20px;align-items:start}.left{display:grid;gap:18px}.hero{background:var(--lime);color:#181d12;border-radius:26px;padding:28px 30px 24px;position:relative;overflow:hidden;min-height:208px}.hero:after{content:'✳';font-size:200px;line-height:1;position:absolute;right:10px;top:9px;opacity:.10;transform:rotate(-14deg)}.eyebrow{font:500 11px 'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;opacity:.7}.hero h1{font-size:clamp(27px,4vw,42px);line-height:1.12;letter-spacing:-.055em;margin:13px 0 8px;max-width:480px}.hero p{margin:0;font-size:14px;opacity:.72}.hero-bottom{display:flex;align-items:center;gap:12px;margin-top:23px;position:relative;z-index:1}.primary{background:#171c12;color:#f4f6ee;border-radius:12px;padding:12px 17px;font-weight:700;font-size:13px;transition:.2s}.primary:hover{transform:translateY(-2px);background:#2a3322}.progress-label{font-size:12px;opacity:.72}.progress-mini{width:90px;height:5px;background:#82994c66;border-radius:9px;overflow:hidden}.progress-mini span{display:block;background:#202719;height:100%;width:0;transition:.35s}.panel{background:var(--panel);border:1px solid #252a23;border-radius:var(--r);padding:22px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.sectionhead h2{font-size:16px;letter-spacing:-.03em;margin:0}.sub{font-size:11px;color:var(--muted)}.add{background:var(--panel2);border:1px solid var(--line);padding:8px 11px;border-radius:10px;color:var(--lime);font-size:12px;font-weight:700}.exercise-list{display:grid;gap:9px}.exercise{display:grid;grid-template-columns:27px 1fr auto;align-items:center;gap:12px;background:#20231f;border:1px solid transparent;border-radius:15px;padding:12px 13px;transition:.2s}.exercise.done{opacity:.52}.check{width:23px;height:23px;border-radius:8px;border:1px solid #4c5546;background:transparent;display:grid;place-items:center;color:#151a10;font-size:14px}.done .check{background:var(--lime);border-color:var(--lime)}.exname{font-size:13px;font-weight:700;letter-spacing:-.02em}.exmeta{color:var(--muted);font-size:11px;margin-top:3px}.exactions{display:flex;align-items:center;gap:7px}.timer-chip{font:11px 'DM Mono',monospace;color:#c0c6b9;background:#2a2f28;padding:7px 9px;border-radius:9px;white-space:nowrap}.play{width:30px;height:30px;border-radius:10px;background:#343a30;color:var(--lime);font-size:12px}.del{width:25px;height:25px;background:transparent;color:#6f7569;font-size:16px}.right{display:grid;gap:18px}.timer-panel{padding:24px;overflow:hidden;position:relative}.timer-panel:before{content:'';position:absolute;width:190px;height:190px;background:#c8f1690b;border-radius:50%;top:-95px;right:-70px}.timer-top{display:flex;justify-content:space-between;align-items:center}.timer-top h2{font-size:16px;margin:0}.live{font:10px 'DM Mono',monospace;color:var(--lime);letter-spacing:.1em}.dial{width:212px;height:212px;margin:21px auto 18px;position:relative;display:grid;place-items:center}.dial svg{position:absolute;inset:0;transform:rotate(-90deg)}.dial circle{fill:none;stroke-width:5}.dial .track{stroke:#30352e}.dial .arc{stroke:var(--lime);stroke-linecap:round;transition:stroke-dashoffset .25s linear}.dial-text{text-align:center;z-index:1}.time{font:500 45px 'DM Mono',monospace;letter-spacing:-.07em}.phase{color:var(--muted);font-size:11px;margin-top:6px}.timer-controls{display:flex;justify-content:center;gap:9px}.timer-controls button{background:#2a2e28;color:var(--text);border-radius:12px;padding:11px 17px;font-size:12px;font-weight:700}.timer-controls .go{background:var(--lime);color:#171c12;min-width:106px}.timer-settings{display:flex;justify-content:center;gap:18px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.setting{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}.setting input{width:42px;background:#252a23;border:1px solid #3b4238;border-radius:7px;color:var(--text);padding:5px;text-align:center;font:12px 'DM Mono',monospace}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#20231f;border-radius:14px;padding:14px}.statlabel{font-size:10px;color:var(--muted)}.statnum{font:600 24px 'DM Mono',monospace;margin-top:8px;letter-spacing:-.06em}.statnum small{font:500 11px Manrope,sans-serif;color:var(--muted);letter-spacing:0}.reminder{display:flex;align-items:center;justify-content:space-between;gap:10px}.reminder h2{font-size:14px;margin:0 0 5px}.reminder p{font-size:11px;color:var(--muted);margin:0}.toggle{width:42px;height:24px;background:#3b4238;border-radius:20px;padding:3px;transition:.2s}.toggle:after{content:'';display:block;width:18px;height:18px;background:#999;border-radius:50%;transition:.2s}.toggle.on{background:#819d43}.toggle.on:after{transform:translateX(18px);background:var(--lime)}.remind-config{display:none;gap:8px;margin-top:14px;align-items:center}.remind-config.show{display:flex}.remind-config input{background:#252a23;color:var(--text);border:1px solid #3b4238;border-radius:8px;padding:7px;font-size:12px}.remind-config button{background:var(--lime);color:#15190f;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:700}.empty{text-align:center;color:var(--muted);font-size:12px;padding:25px 0}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#e9f6cf;color:#1b2411;padding:12px 18px;border-radius:13px;font-size:13px;font-weight:700;box-shadow:0 8px 30px #0005;transition:.25s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:18px;z-index:5}.modal.open{display:grid}.dialog{width:min(400px,100%);background:#1a1e18;border:1px solid #343a31;border-radius:20px;padding:23px}.dialog h3{margin:0 0 18px}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:11px;color:var(--muted)}.field input{width:100%;padding:11px 12px;background:#242922;border:1px solid #3b4238;color:var(--text);border-radius:10px;outline:none}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.dialog-actions button{border-radius:9px;padding:10px 14px;background:#30362d;font-size:12px}.dialog-actions .save{background:var(--lime);color:#171c12;font-weight:700}@media(max-width:760px){.app{padding:15px 15px 40px}.top{padding-bottom:19px}.main{grid-template-columns:1fr}.right{grid-template-columns:1fr 1fr;align-items:start}.timer-panel{grid-column:1/-1;grid-row:1}.panel{padding:18px}.hero{padding:23px 22px}.dial{width:190px;height:190px}.dial svg{width:190px;height:190px}.exercise{padding:11px 9px;gap:8px}.exactions{gap:5px}.timer-chip{padding:6px 7px}}@media(max-width:420px){.right{grid-template-columns:1fr}.stats{grid-row:2}.reminder-panel{grid-row:3}.hero h1{font-size:28px}.timer-chip{font-size:10px}}
</style>
</head>
<body><div class="app">
<header class="top"><div class="brand"><div class="brandmark">↗</div>FORM / HOME</div><div class="date" id="today"></div></header>
<main class="main"><section class="left">
<div class="hero"><div class="eyebrow">YOUR DAILY MOVEMENT</div><h1>오늘의 몸을,<br>조금 더 가볍게.</h1><p>완벽한 하루보다 꾸준한 한 세트.</p><div class="hero-bottom"><button class="primary" id="startAll">운동 시작하기&nbsp; ↗</button><div class="progress-label" id="progressText">0 / 0 완료</div><div class="progress-mini"><span id="progressBar"></span></div></div></div>
<div class="panel"><div class="sectionhead"><div><h2>오늘의 루틴</h2><div class="sub" style="margin-top:5px">체크하고, 내 페이스대로</div></div><button class="add" id="addBtn">＋ 운동 추가</button></div><div class="exercise-list" id="list"></div></div>
</section><aside class="right">
<div class="panel timer-panel"><div class="timer-top"><h2>인터벌 타이머</h2><span class="live" id="timerStatus">READY</span></div><div class="dial"><svg viewBox="0 0 220 220"><circle class="track" cx="110" cy="110" r="99"/><circle class="arc" id="arc" cx="110" cy="110" r="99" stroke-dasharray="622.04" stroke-dashoffset="0"/></svg><div class="dial-text"><div class="time" id="clock">00:30</div><div class="phase" id="phase">운동 시간</div></div></div><div class="timer-controls"><button id="resetTimer">초기화</button><button class="go" id="toggleTimer">시작</button><button id="skipTimer">건너뛰기&nbsp;›</button></div><div class="timer-settings"><label class="setting">운동 <input id="workSec" type="number" min="5" max="3600" value="30"> 초</label><label class="setting">휴식 <input id="restSec" type="number" min="0" max="3600" value="15"> 초</label></div></div>
<div class="panel stats"><div class="stat"><div class="statlabel">오늘 완료</div><div class="statnum" id="statDone">0 <small>개</small></div></div><div class="stat"><div class="statlabel">연속 운동</div><div class="statnum" id="streak">0 <small>일</small></div></div></div>
<div class="panel reminder-panel"><div class="reminder"><div><h2>운동 알림</h2><p id="reminderText">원하는 시간에 리마인드</p></div><button id="reminderToggle" class="toggle" aria-label="운동 알림 켜기"></button></div><div class="remind-config" id="remindConfig"><input type="time" id="reminderTime" value="19:00"><button id="saveReminder">시간 저장</button></div></div>
</aside></main></div><div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="dialog"><h3>운동 추가하기</h3><div class="field"><label for="newName">운동 이름</label><input id="newName" placeholder="예: 런지"></div><div class="field"><label for="newMeta">횟수 또는 시간</label><input id="newMeta" placeholder="예: 좌우 12회 × 3세트"></div><div class="field"><label for="newDuration">타이머 기본 시간 (초)</label><input id="newDuration" type="number" min="5" value="30"></div><div class="dialog-actions"><button id="cancelAdd">취소</button><button class="save" id="confirmAdd">추가</button></div></div></div>
<script>
const defaults=[{name:'스쿼트',meta:'15회 × 3세트',sec:40},{name:'푸시업',meta:'10회 × 3세트',sec:35},{name:'글루트 브리지',meta:'15회 × 3세트',sec:40},{name:'플랭크',meta:'30초 × 3세트',sec:30},{name:'쿨다운 스트레칭',meta:'전신 3분',sec:180}];const key='form-home-v1';let state=JSON.parse(localStorage.getItem(key)||'null')||{items:defaults.map((x,i)=>({...x,id:i,done:false})),history:{},streak:0,reminder:{on:false,time:'19:00'}};let activeItem=null,remaining=30,phase='work',running=false,interval=null,lastReminder='';
const todayKey=dateKey();if(state.day!==todayKey){state.items.forEach(item=>item.done=false);state.day=todayKey;let n=1;for(let d=new Date();;){d.setDate(d.getDate()-1);if(state.history[dateKey(d)])n++;else break}state.streak=state.history[todayKey]?n:Math.max(0,n-1);save()}
const $=s=>document.querySelector(s);function save(){localStorage.setItem(key,JSON.stringify(state))}function dateKey(d=new Date()){return d.toLocaleDateString('sv-SE')}function syncReminder(){if(window.HomeFitNative){let [h,m]=(state.reminder.time||'19:00').split(':').map(Number);window.HomeFitNative.setDailyReminder(!!state.reminder.on,h,m)}}function render(){let list=$('#list');list.innerHTML='';if(!state.items.length)list.innerHTML='<div class="empty">아직 등록된 운동이 없어요. 첫 운동을 추가해 보세요.</div>';state.items.forEach(item=>{let row=document.createElement('div');row.className='exercise'+(item.done?' done':'');row.innerHTML=`<button class="check" aria-label="완료 표시">${item.done?'✓':''}</button><div><div class="exname"></div><div class="exmeta"></div></div><div class="exactions"><span class="timer-chip">${item.sec>=60?`${Math.floor(item.sec/60)}:${String(item.sec%60).padStart(2,'0')}`:`${item.sec}초`}</span><button class="play" title="이 운동 타이머 시작">▶</button><button class="del" title="운동 삭제">×</button></div>`;row.querySelector('.exname').textContent=item.name;row.querySelector('.exmeta').textContent=item.meta;row.querySelector('.check').onclick=()=>{item.done=!item.done;if(item.done)state.history[dateKey()]=true;save();render()};row.querySelector('.play').onclick=()=>{activeItem=item;$('#workSec').value=item.sec;phase='work';remaining=item.sec;renderTimer();if(!running)startTimer()};row.querySelector('.del').onclick=()=>{state.items=state.items.filter(x=>x.id!==item.id);save();render()};list.appendChild(row)});let done=state.items.filter(x=>x.done).length;$('#progressText').textContent=`${done} / ${state.items.length} 완료`;$('#progressBar').style.width=state.items.length?`${done/state.items.length*100}%`:'0';$('#statDone').innerHTML=`${done} <small>개</small>`;let streak=state.history[dateKey()]?1:0;for(let d=new Date();;){d.setDate(d.getDate()-1);if(state.history[dateKey(d)])streak++;else break}state.streak=streak;$('#streak').innerHTML=`${streak} <small>일</small>`;$('#reminderToggle').classList.toggle('on',state.reminder.on);$('#remindConfig').classList.toggle('show',state.reminder.on);$('#reminderTime').value=state.reminder.time;$('#reminderText').textContent=state.reminder.on?`매일 ${state.reminder.time}에 알려드려요`:'원하는 시간에 리마인드';syncReminder()}
function renderTimer(){let total=phase==='work'?Number($('#workSec').value):Number($('#restSec').value);$('#clock').textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;$('#phase').textContent=phase==='work'?(activeItem?activeItem.name+' · 운동 시간':'운동 시간'):'휴식 시간';$('#timerStatus').textContent=running?'RUNNING':'READY';$('#toggleTimer').textContent=running?'일시정지':'시작';let frac=total?remaining/total:0;$('#arc').style.strokeDashoffset=622.04*(1-frac);$('#arc').style.stroke=phase==='work'?'var(--lime)':'var(--blue)'}function beep(){try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=phase==='work'?740:520;g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.2,a.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.5);o.start();o.stop(a.currentTime+.52)}catch(e){}}function notify(title,body){if(window.HomeFitNative){window.HomeFitNative.notify(title,body);window.HomeFitNative.vibrate()}else if('Notification'in window&&Notification.permission==='granted')new Notification(title,{body});toast(body)}function toast(msg){let el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2800)}function startTimer(){if(running)return;running=true;renderTimer();interval=setInterval(()=>{remaining--;if(remaining<=0){beep();if(phase==='work'){if(Number($('#restSec').value)>0){phase='rest';remaining=Number($('#restSec').value);notify('운동 완료!','잠시 쉬고 다음 세트를 준비하세요.')}else{running=false;clearInterval(interval);notify('세트 완료!','수고했어요. 물 한 모금 마셔요.')}}else{phase='work';remaining=Number($('#workSec').value);notify('휴식 끝!','다시 시작해 볼까요?')}if(!running)$('#toggleTimer').textContent='시작'}renderTimer()},1000)}function stopTimer(){running=false;clearInterval(interval);renderTimer()}
$('#toggleTimer').onclick=()=>running?stopTimer():startTimer();$('#resetTimer').onclick=()=>{stopTimer();phase='work';remaining=Number($('#workSec').value);activeItem=null;renderTimer()};$('#skipTimer').onclick=()=>{if(phase==='work'){phase='rest';remaining=Number($('#restSec').value)}else{phase='work';remaining=Number($('#workSec').value)}renderTimer()};['workSec','restSec'].forEach(id=>$('#'+id).onchange=()=>{if(phase==='work')remaining=Number($('#workSec').value);renderTimer()});$('#startAll').onclick=()=>{activeItem=null;phase='work';remaining=Number($('#workSec').value);startTimer();document.querySelector('.timer-panel').scrollIntoView({behavior:'smooth',block:'center'})};$('#addBtn').onclick=()=>{$('#modal').classList.add('open');$('#newName').focus()};$('#cancelAdd').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.remove('open')};$('#confirmAdd').onclick=()=>{let name=$('#newName').value.trim();if(!name){$('#newName').focus();return}state.items.push({id:Date.now(),name,meta:$('#newMeta').value.trim()||'자유 횟수',sec:Math.max(5,Number($('#newDuration').value)||30),done:false});save();render();$('#modal').classList.remove('open');$('#newName').value='';$('#newMeta').value='';toast('루틴에 운동을 추가했어요')};$('#reminderToggle').onclick=async()=>{if(!state.reminder.on&&'Notification'in window&&Notification.permission==='default'){await Notification.requestPermission()}state.reminder.on=!state.reminder.on;save();render();toast(state.reminder.on?'운동 알림을 켰어요':'운동 알림을 껐어요')};$('#saveReminder').onclick=()=>{state.reminder.time=$('#reminderTime').value||'19:00';save();render();toast('알림 시간을 저장했어요')};setInterval(()=>{if(!state.reminder.on)return;let now=new Date(),tm=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,today=dateKey();if(tm===state.reminder.time&&lastReminder!==today){lastReminder=today;if('Notification'in window&&Notification.permission==='granted')new Notification('오늘의 홈트 시간이에요',{body:'가벼운 스트레칭부터 시작해 볼까요?'});toast('오늘의 홈트 시간이에요 · 가벼운 스트레칭부터 시작해요')}} ,15000);
$('#today').textContent=new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'long'}).format(new Date());render();renderTimer();
</script></body></html>
